name: Update GitHub Statistics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          REPOS=$(gh api users/snehapankhi05 --jq '.public_repos')
          FOLLOWERS=$(gh api users/snehapankhi05 --jq '.followers')
          FOLLOWING=$(gh api users/snehapankhi05 --jq '.following')

          cat > assets/github-stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="700"
               height="210"
               viewBox="0 0 700 210">

            <rect width="700"
                  height="210"
                  rx="16"
                  fill="#0d1117"/>

            <text x="40"
                  y="45"
                  fill="#ffffff"
                  font-size="25"
                  font-family="Arial"
                  font-weight="bold">
              GitHub Statistics
            </text>

            <text x="40"
                  y="90"
                  fill="#8b949e"
                  font-size="14"
                  font-family="Arial">
              Public Repositories
            </text>

            <text x="40"
                  y="122"
                  fill="#ffffff"
                  font-size="25"
                  font-family="Arial"
                  font-weight="bold">
              ${REPOS}
            </text>

            <text x="270"
                  y="90"
                  fill="#8b949e"
                  font-size="14"
                  font-family="Arial">
              Followers
            </text>

            <text x="270"
                  y="122"
                  fill="#ffffff"
                  font-size="25"
                  font-family="Arial"
                  font-weight="bold">
              ${FOLLOWERS}
            </text>

            <text x="470"
                  y="90"
                  fill="#8b949e"
                  font-size="14"
                  font-family="Arial">
              Following
            </text>

            <text x="470"
                  y="122"
                  fill="#ffffff"
                  font-size="25"
                  font-family="Arial"
                  font-weight="bold">
              ${FOLLOWING}
            </text>

            <text x="40"
                  y="170"
                  fill="#7C3AED"
                  font-size="13"
                  font-family="Arial">
              Automatically updated with GitHub Actions
            </text>

          </svg>
          EOF

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi
